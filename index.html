<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>looney_olsen</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --accent: #ff00ff;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        canvas { position: absolute; top:0; left:0; z-index:1; }
        .content {
            z-index: 2;
            text-align: center;
            padding: 0 20px;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 6.5rem;
            font-weight: 700;
            letter-spacing: -4px;
            background: linear-gradient(90deg, #fff, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            font-size: 1.4rem;
            opacity: 0.8;
            margin: 20px 0 40px;
        }
        .btn {
            padding: 16px 42px;
            background: transparent;
            border: 2px solid #ff00ff;
            color: white;
            font-size: 1.1rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.4s;
        }
        .btn:hover {
            background: #ff00ff;
            box-shadow: 0 0 40px #ff00ff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="hero">
        <canvas id="bg"></canvas>
        <div class="content">
            <h1>LOONEY_OLSEN</h1>
            <p class="tagline">Chaos architect • Digital outlaw • Built different</p>
            <button class="btn" onclick="document.getElementById('about').scrollIntoView({behavior:'smooth'})">ENTER THE VOID</button>
        </div>
    </div>

    <section id="about" style="padding:120px 10%; background:#111; text-align:center;">
        <h2 style="font-size:3rem; margin-bottom:40px;">The Legend</h2>
        <p style="max-width:700px; margin:0 auto; font-size:1.3rem; line-height:1.8; opacity:0.9;">
            From the streets of Windhoek to the digital underworld. I don't follow trends — I break them.<br><br>
            Currently building shit that makes people say "how the fuck did he do that".
        </p>
    </section>

    <script>
        // Three.js particle background
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('bg'), alpha: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const particles = new THREE.BufferGeometry();
        const particleCount = 5000;
        const positions = new Float32Array(particleCount * 3);
        
        for(let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 2000;
            positions[i+1] = (Math.random() - 0.5) * 2000;
            positions[i+2] = (Math.random() - 0.5) * 2000;
        }
        
        particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const material = new THREE.PointsMaterial({
            size: 3,
            color: 0xff00ff,
            transparent: true,
            opacity: 0.6
        });
        
        const pointCloud = new THREE.Points(particles, material);
        scene.add(pointCloud);
        camera.position.z = 800;
        
        function animate() {
            requestAnimationFrame(animate);
            pointCloud.rotation.y += 0.0003;
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
